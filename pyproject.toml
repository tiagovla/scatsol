[project]
name = "scatsol"
version = "0.0.2"
description = "Electromagnetic Scattering Solutions"
authors = [{ name = "tiagovla", email = "tiagovla@gmail.com" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.12.0",
    "matplotlib>=3.8.3",
]
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.1.2",
    "coverage>=6.4.4",
    "pytest-cov>=3.0.0",
    "black>=22.6.0",
    "mkdocs>=1.5.3",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-material>=9.5.11",
]

[tool.uv]
managed = true

[tool.black]
line-length = 100
target-version = ['py312']
